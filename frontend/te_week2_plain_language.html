.reco{margin:12px 0;padding:13px;border-radius:11px;background:var(--panel2);border:1px solid var(--line)}

</head>

  <div>
    <div class="eyebrow">TRENCH EDGE</div>

<main>

</main>
</div>

const pct=x=>x==null?"—":Math.round(Number(x)*100)+"%";

function verdict(g){
 const s=g.decision?.state;
 if(s==="PASS"||s==="QUALIFIED") return {label:"BET QUALIFIES",cls:"verdict-pass",text:"The model sees enough value and data quality for this wager to clear its current betting gates."};
 if(s==="FAIL") return {label:"PASS ON THIS BET",cls:"verdict-fail",text:"The model does not see enough value to justify a wager at the current market price."};
 return {label:"WAIT FOR MORE DATA",cls:"verdict-watch",text:"The model does not yet have enough reliable information to make this a qualified wager."};
}
function friendlyMarket(g){
 let d=g.market?.display;
 if(d) return d;
 let m=g.market||[], bits=[];
 if(m.home_spread!=null) bits.push(`${g.home} ${Number(m.home_spread)>0?"+":""}${m.home_spread}`);
 if(m.total!=null) bits.push(`Total ${m.total}`);
 return bits.join(" • ")||"Market line unavailable";
}
function valueText(g){
 let e=Math.abs(Number(g.decision?.edge||0));
 if(e>=7) return "Large difference from the market";
 if(e>=4) return "Meaningful difference from the market";
 if(e>=2.5) return "Small but actionable difference";
 return "Little separation from the market";
}
function riskText(x){
 x=Number(x||0);
 if(x>=65)return "High";
 if(x>=45)return "Moderate";
 return "Low";
}
function dataText(x){
 x=Number(x||0);
 if(x>=80)return "Strong";
 if(x>=65)return "Usable";
 return "Limited";
}
function filtered(){
 let a=[...state.games],q=document.getElementById("search").value.toLowerCase().trim();
 if(q)a=a.filter(g=>(g.away+" "+g.home).toLowerCase().includes(q));

 if(state.view==="qualified")a=a.filter(g=>["PASS","QUALIFIED"].includes(g.decision?.state));
 if(state.view==="fails")a=a.filter(g=>g.decision?.state==="FAIL");
 if(state.view==="results")a=a.filter(g=>g.result);
 let s=document.getElementById("sort").value;
 a.sort((x,y)=>s==="dqs"?(y.derived?.dqs||0)-(x.derived?.dqs||0):s==="ocrs"?(x.derived?.ocrs||0)-(y.derived?.ocrs||0):Math.abs(y.decision?.edge||0)-Math.abs(x.decision?.edge||0));
 return a;
}
function render(){
 let a=filtered(),q=state.games.filter(g=>["PASS","QUALIFIED"].includes(g.decision?.state)).length;

 document.getElementById("games").innerHTML=a.length?a.map(g=>{
   let v=verdict(g);
   return `<div class="game ${g.id===state.selected?"active":""}" onclick="selectGame('${g.id}')">
   <div class=row><div><div class=match>${g.away} @ ${g.home}</div><div class=small>${friendlyMarket(g)}</div></div><span class="badge ${g.decision?.state}">${v.label}</span></div>

   :`<div class=panel>No games match your search.</div>`;

}
function selectGame(id){state.selected=id;state.tab="overview";render()}
function setTab(t){state.tab=t;renderDetail()}
function tab(id,label){return `<button class="tab ${state.tab===id?"active":""}" onclick="setTab('${id}')">${label}</button>`}
function renderDetail(){
 const g=state.games.find(x=>x.id===state.selected)||state.games[0]; if(!g){return}
 const p=g.prediction||{},d=g.derived||{},ev=g.ev||{},v=verdict(g);
 document.getElementById("detail").innerHTML=`<div class=hero>
 <div class=row><div><div class=kicker>TE GAME ANALYSIS</div><h2>${g.away} @ ${g.home}</h2><div class=small>${friendlyMarket(g)}</div></div><span class="badge ${g.decision?.state}">${v.label}</span></div>
 <div class=score>${g.away} ${whole(p.away_points)} &nbsp;•&nbsp; ${g.home} ${whole(p.home_points)}</div>
 <div class="reco"><strong class="${v.cls}">${v.label}</strong>${v.text}</div>
 <div class=metrics>
   <div class=metric><span>Model confidence <span class=help title="The model's estimated chance that its selected wager wins.">?</span></span><b>${pct(ev.probability)}</b></div>
   <div class=metric><span>Betting value <span class=help title="How far the model's projection differs from the current betting market. A bigger number is not automatically a better bet.">?</span></span><b>${one(Math.abs(g.decision?.edge||0))} pts</b></div>
   <div class=metric><span>Data quality <span class=help title="How complete and reliable the information behind this prediction is.">?</span></span><b>${dataText(d.dqs)}</b></div>
   <div class=metric><span>Game risk <span class=help title="How vulnerable this prediction is to matchup, volatility, field-position, and other failure risks. Lower is better.">?</span></span><b>${riskText(d.ocrs)}</b></div>
 </div>
 <div class=tabs>${tab("overview","Overview")}${tab("why","Why TE Likes It")}${tab("market","Betting Value")}${tab("risk","Risk Factors")}${tab("advanced","Advanced Analytics")}</div>
 <div class=panel>${panel(g)}</div></div>`;
}
function panel(g){
 const p=g.prediction||{},d=g.derived||{},ev=g.ev||{},dec=g.decision||{},a=g.attribution||{};
 if(state.tab==="overview")return `<div class=sectiontitle>What the model is saying</div>
 <div class=item><span>Projected final score</span><b>${g.away} ${whole(p.away_points)} • ${g.home} ${whole(p.home_points)}</b></div>
 <div class=item><span>Current betting line</span><b>${friendlyMarket(g)}</b></div>
 <div class=item><span>Model's preferred wager</span><b>${dec.side||"No qualified wager"}</b></div>
 <div class=item><span>Estimated win chance <span class=help title="Estimated probability for the selected wager, not the probability the team wins the game outright.">?</span></span><b>${pct(ev.probability)}</b></div>
 <div class=item><span>Value vs. sportsbook <span class=help title="The model's difference from the sportsbook line. TE still requires risk, data-quality and expected-value checks before qualifying a bet.">?</span></span><b>${valueText(g)}</b></div>`;
 if(state.tab==="why"){
   let drivers=(a.drivers||[]).slice(0,3);
   return `<div class=sectiontitle>Biggest reasons behind the prediction</div>${drivers.length?drivers.map((x,i)=>`<div class=item><span>${i+1}. ${x.name}</span><b class=good>Supports pick</b></div>`).join(""):`<div class=explain>Detailed drivers will populate from the attribution layer after a live model refresh.</div>`}
   <div class=explain style="margin-top:12px">These are the strongest factors pushing the projection toward the model's preferred side. They are explanations of the prediction, not separate betting picks.</div>`;
 }
 if(state.tab==="market")return `<div class=sectiontitle>Is the model seeing a price advantage?</div>
 <div class=item><span>Difference from market</span><b>${one(Math.abs(dec.edge||0))} points</b></div>
 <div class=item><span>Model win probability</span><b>${pct(ev.probability)}</b></div>
 <div class=item><span>Break-even probability <span class=help title="At standard -110 odds, a bettor needs to win about 52.4% of wagers just to break even before considering variance.">?</span></span><b>${pct(ev.break_even_probability)}</b></div>
 <div class=item><span>Estimated expected value <span class=help title="Estimated long-run return per dollar risked if the model probability is well calibrated. Positive EV does not guarantee this individual bet wins.">?</span></span><b class="${(ev.expected_value||0)>0?"good":"bad"}">${ev.expected_value==null?"—":(ev.expected_value*100).toFixed(1)+"%"}</b></div>
 <div class=explain style="margin-top:12px">A large projection difference alone does not qualify a wager. TE also checks data quality, matchup risk, and whether the estimated probability actually beats the sportsbook's break-even requirement.</div>`;
 if(state.tab==="risk"){
   let c=(a.counterweights||[]).slice(0,3);
   return `<div class=sectiontitle>What could make this prediction wrong?</div>
   <div class=item><span>Overall game risk</span><b>${riskText(d.ocrs)}</b></div>
   <div class=item><span>Drive-stalling risk</span><b>${riskText(d.dfr)}</b></div>
   <div class=item><span>Field-position / special-teams risk</span><b>${riskText(d.fpse)}</b></div>
   ${c.map(x=>`<div class=item><span>${x.name}</span><b class=warn>Counterweight</b></div>`).join("")}
   <div class=explain style="margin-top:12px">Risk scores flag ways a good statistical matchup can still fail, such as pressure, stalled drives, turnovers, short fields, or special-teams swings.</div>`;
 }
 return `<div class=sectiontitle>Advanced model diagnostics</div>
 <div class=explain style="margin-bottom:12px">This section is optional. It exposes TE's internal diagnostics for advanced users without requiring a casual bettor to understand them.</div>
 <div class=item><span>Run trench matchup (RunMOTE) <span class=help title="TE's standardized estimate of how the offense's run-blocking matchup compares with the opponent's run defense.">?</span></span><b>${one(g.trench?.away?.RunMOTE)} / ${one(g.trench?.home?.RunMOTE)}</b></div>
 <div class=item><span>Pass trench matchup (PassMOTE) <span class=help title="TE's standardized estimate of pass protection versus opposing pass-rush pressure.">?</span></span><b>${one(g.trench?.away?.PassMOTE)} / ${one(g.trench?.home?.PassMOTE)}</b></div>
 <div class=item><span>Data Quality Score (DQS)</span><b>${one(d.dqs)}/100</b></div>
 <div class=item><span>Overall Context Risk Score (OCRS)</span><b>${one(d.ocrs)}/100</b></div>
 <div class=item><span>Edge Concentration (ECS)</span><b>${one((a.ecs||0)*100)}%</b></div>
 <div class=item><span>Driver Agreement Count (DAC)</span><b>${a.dac??"—"}</b></div>`;
}
async function loadBoard(){
 const p=window.TE_EMBEDDED_BOARD;
 state.games=p.games||[]; if(!state.selected&&state.games[0])state.selected=state.games[0].id;
 document.getElementById("modeText").textContent="INTERACTIVE PRODUCT DEMO • Plain-language betting interface";
 render();
}
async function refreshWeek(){document.getElementById("modeText").textContent="Standalone demo reloaded • Live data refresh requires the backend/API keys";state.games=window.TE_EMBEDDED_BOARD.games||[];render()}
document.getElementById("refreshBtn").onclick=refreshWeek;
document.getElementById("demoBtn").onclick=loadBoard;
document.querySelectorAll(".nav").forEach(b=>b.onclick=()=>{document.querySelectorAll(".nav").forEach(x=>x.classList.remove("active"));b.classList.add("active");state.view=b.dataset.view;render()});
document.getElementById("search").oninput=render;
document.getElementById("sort").onchange=render;
loadBoard();

</script>
</body>
</html>
