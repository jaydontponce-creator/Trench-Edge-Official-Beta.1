services:
  - type: web
    name: trench-edge-beta
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: CFBD_API_KEY
        sync: false
      - key: ODDS_API_KEY
        sync: false
